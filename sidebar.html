<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ໂຫຼດ Lucide Icons ສໍາລັບໄອຄອນທີ່ສວຍງາມ -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Modern Sidebar</title>
</head>
<body class="bg-gray-50">

    <!-- Sidebar Container -->
    <aside class="fixed left-0 top-0 h-screen w-64 bg-white border-r border-gray-200 flex flex-col justify-between p-4 transition-all duration-300">
        
        <div>
            <!-- Logo Section -->
            <div class="flex items-center gap-3 px-2 mb-10">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                    <i data-lucide="layout-dashboard" class="text-white w-5 h-5"></i>
                </div>
                <span class="text-xl font-bold text-gray-800 tracking-tight">TechPro</span>
            </div>

            <!-- Navigation Links -->
            <nav class="space-y-1">
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 bg-indigo-50 text-indigo-700 rounded-xl font-medium transition-all">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span>ໜ້າຫຼັກ</span>
                </a>

                <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl transition-all group">
                    <i data-lucide="bar-chart-2" class="w-5 h-5 group-hover:text-indigo-600"></i>
                    <span>ລາຍງານຜົນ</span>
                </a>

                <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl transition-all group">
                    <i data-lucide="users" class="w-5 h-5 group-hover:text-indigo-600"></i>
                    <span>ຈັດການຜູ້ໃຊ້</span>
                </a>

                <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl transition-all group">
                    <i data-lucide="folder-kanban" class="w-5 h-5 group-hover:text-indigo-600"></i>
                    <span>ໂຄງການ</span>
                </a>

                <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl transition-all group">
                    <i data-lucide="settings" class="w-5 h-5 group-hover:text-indigo-600"></i>
                    <span>ຕັ້ງຄ່າ</span>
                </a>
            </nav>
        </div>

        <!-- User Profile Section -->
        <div class="border-t border-gray-100 pt-4 px-2">
            <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-gray-50 cursor-pointer transition-all">
                <img src="https://ui-avatars.com/api/?name=Somsak+Dev&background=indigo&color=fff" alt="User" class="w-10 h-10 rounded-full border border-gray-200">
                <div class="flex-1 overflow-hidden">
                    <p class="text-sm font-semibold text-gray-800 truncate">Somsak Dev</p>
                    <p class="text-xs text-gray-500 truncate">admin@techpro.com</p>
                </div>
                <i data-lucide="log-out" class="w-4 h-4 text-gray-400 hover:text-red-500"></i>
            </div>
        </div>

    </aside>

    <!-- Main Content Area -->
    <main class="ml-64 p-8">
        <h1 class="text-2xl font-bold text-gray-800">ຍິນດີຕ້ອນຮັບເຂົ້າສູ່ລະບົບ</h1>
        <p class="text-gray-500 mt-2">ເລືອກເມນູດ້ານຊ້າຍມືເພື່ອເລີ່ມຕົ້ນການເຮັດວຽກ.</p>
    </main>

    <!-- Script ເພື່ອໃຫ້ Lucide Icons ເຮັດວຽກ -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
