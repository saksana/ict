<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Page - Glassmorphism</title>
    
    <!-- Font Awesome ສໍາລັບ Icon ຕ່າງໆ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS ສ່ວນການອອກແບບ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Phetsarath OT', sans-serif;
        }

        body {
            /* ພື້ນຫຼັງ Gradient ໂທນສີສົ້ມໄປຫາຂາວ */
            background: linear-gradient(135deg, #d54700 0%, #c32424 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        /* Login Card ແບບ Glassmorphism */
        .login-card {
            background: rgba(255, 255, 255); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .illustration {
            width: 160px;
            margin-bottom: 15px;
        }

        h2 {
            color: #d35400;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* ຈັດການ Input Group */
        .input-group {
            position: relative;
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group i:not(.toggle-password) {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #e67e22;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px;
            border: 1px solid rgba(235, 225, 225, 0.5);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.7);
            outline: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: #fff;
            border-color: #ff9d6c;
            box-shadow: 0 0 8px rgba(230, 126, 34, 0.2);
        }

        /* ປຸ່ມສະແດງ/ເຊື່ອງ Password */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            transition: 0.2s;
        }

        .toggle-password:hover {
            color: #e67e22;
        }

        /* ປຸ່ມ Login */
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #e67e22;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #d35400;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(211, 84, 0, 0.3);
        }

        /* ລິ້ງດ້ານລຸ່ມ */
        .footer-links {
            margin-top: 25px;
            font-size: 0.9rem;
        }

        .footer-links a {
            color: #d35400;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-links p {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="login-card">
            <!-- ຮູບພາບປະກອບ -->
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQaRiyNktl-_jYQp22kSo3ead6J57dLNVKw7A&s" alt="Login Illustration" class="illustration">
            
            <h2>ເຂົ້າສູ່ລະບົບ</h2>
            <p class="subtitle">ຍິນດີຕ້ອນຮັບເຂົ້າສູ່ລະບົບຈັດການໄອທີ</p>
            
            <form id="loginForm">
                <!-- Username -->
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="ຊື່ຜູ້ໃຊ້ ຫຼື ອີເມວ" required>
                </div>
                
                <!-- Password -->
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="ລະຫັດຜ່ານ" required>
                    <i class="fa-solid fa-eye-slash toggle-password" id="togglePassword"></i>
                </div>
                
                <button type="submit" class="login-btn">Log In</button>
            </form>
            
            <!-- <div class="footer-links">
                <a href="#">ລືມລະຫັດຜ່ານ?</a>
                <p>ຍັງບໍ່ມີບັນຊີບໍ? <a href="#">ສ້າງບັນຊີໃໝ່</a></p>
            </div> -->
        </div>
    </div>
    

    <script>
        // ສ່ວນ JavaScript ສໍາລັບ Toggle Password
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            // ສະຫຼັບ type ລະຫວ່າງ password ແລະ text
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // ສະຫຼັບ Icon ລະຫວ່າງ ຕາເປີດ (fa-eye) ແລະ ຕາປິດ (fa-eye-slash)
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // ປ້ອງກັນການ Refresh ໜ້າຈໍເວລາ Submit (ຕົວຢ່າງ)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('ກຳລັງເຂົ້າສູ່ລະບົບ...');
        });
    </script>
</body>
</html>
