<!DOCTYPE html>
<html lang="lo">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Login Page - Tailwind CSS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "Noto Sans Lao", "ui-sans-serif", "system-ui"],
                    },
                    colors: {
                        orangeTheme: {
                            50: "#fff7ed",
                            100: "#ffedd5",
                            400: "#fb923c",
                            500: "#f97316",
                            600: "#ea580c",
                            700: "#c2410c",
                        },
                    },
                    boxShadow: {
                        soft: "0 18px 45px rgba(124, 45, 18, 0.22)",
                    },
                },
            },
        };
    </script>
</head>

<body
    class="min-h-screen overflow-hidden bg-gradient-to-br from-orangeTheme-700 via-red-600 to-orangeTheme-400 font-sans text-slate-900 antialiased">
    <main class="flex min-h-screen items-center justify-center px-4 py-6 sm:px-6">
        <section
            class="w-full max-w-[420px] rounded-[25px] border border-white/30 bg-white/95 p-6 text-center shadow-soft backdrop-blur-xl sm:p-10">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQaRiyNktl-_jYQp22kSo3ead6J57dLNVKw7A&s"
                alt="Login Illustration" class="mx-auto mb-4 h-auto w-36 sm:w-40" />

            <h1 class="text-2xl font-bold tracking-normal text-orangeTheme-700 sm:text-[1.8rem]">ເຂົ້າສູ່ລະບົບ</h1>
            <p class="mt-2 text-sm leading-6 text-slate-600">ຍິນດີຕ້ອນຮັບເຂົ້າສູ່ລະບົບຈັດການໄອທີ</p>

            <form id="loginForm" class="mt-6 space-y-[18px]">
                <div class="relative text-left">
                    <span
                        class="pointer-events-none absolute inset-y-0 left-0 flex w-12 items-center justify-center text-orangeTheme-500">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="2" />
                        </svg>
                    </span>
                    <input type="text" name="username" autocomplete="username" placeholder="ຊື່ຜູ້ໃຊ້ ຫຼື ອີເມວ"
                        required
                        class="h-[52px] w-full rounded-xl border border-orange-100 bg-white/75 px-11 text-base text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-orangeTheme-400 focus:bg-white focus:shadow-[0_0_0_4px_rgba(251,146,60,0.16)]" />
                </div>

                <div class="relative text-left">
                    <span
                        class="pointer-events-none absolute inset-y-0 left-0 flex w-12 items-center justify-center text-orangeTheme-500">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                            <path
                                d="M6.5 10h11A1.5 1.5 0 0 1 19 11.5v7A1.5 1.5 0 0 1 17.5 20h-11A1.5 1.5 0 0 1 5 18.5v-7A1.5 1.5 0 0 1 6.5 10Z"
                                stroke="currentColor" stroke-width="2" />
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        placeholder="ລະຫັດຜ່ານ" required
                        class="h-[52px] w-full rounded-xl border border-orange-100 bg-white/75 px-11 text-base text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-orangeTheme-400 focus:bg-white focus:shadow-[0_0_0_4px_rgba(251,146,60,0.16)]" />
                    <button type="button" id="togglePassword"
                        class="absolute inset-y-0 right-0 flex w-12 items-center justify-center rounded-r-xl text-slate-500 transition hover:text-orangeTheme-600 focus:outline-none focus:ring-4 focus:ring-orange-100"
                        aria-label="ສະແດງລະຫັດຜ່ານ" aria-pressed="false">
                        <svg id="eyeOpen" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor"
                                stroke-width="2" stroke-linejoin="round" />
                            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2" />
                        </svg>
                        <svg id="eyeClosed" class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="m3 3 18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            <path
                                d="M10.7 5.2A10.6 10.6 0 0 1 12 5c6 0 9.5 7 9.5 7a17.3 17.3 0 0 1-3 4.1M6.4 6.8C3.9 8.5 2.5 12 2.5 12s3.5 7 9.5 7c1.7 0 3.2-.5 4.5-1.2"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>

                <button type="submit"
                    class="mt-2 h-[52px] w-full rounded-xl bg-orangeTheme-500 px-5 text-lg font-semibold text-white shadow-lg shadow-orange-700/25 transition hover:-translate-y-0.5 hover:bg-orangeTheme-700 hover:shadow-xl hover:shadow-orange-700/30 focus:outline-none focus:ring-4 focus:ring-orange-100">
                    Log In
                </button>
            </form>

            <div class="mt-6 text-sm">
                <a href="#"
                    class="font-medium text-orangeTheme-700 transition hover:text-orangeTheme-600 hover:underline">ລືມລະຫັດຜ່ານ?</a>
            </div>
        </section>
    </main>

    <script>
        const togglePassword = document.querySelector("#togglePassword");
        const passwordInput = document.querySelector("#password");
        const eyeOpen = document.querySelector("#eyeOpen");
        const eyeClosed = document.querySelector("#eyeClosed");

        togglePassword.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            togglePassword.setAttribute("aria-pressed", String(isPassword));
            togglePassword.setAttribute("aria-label", isPassword ? "ເຊື່ອງລະຫັດຜ່ານ" : "ສະແດງລະຫັດຜ່ານ");
            eyeOpen.classList.toggle("hidden", !isPassword);
            eyeClosed.classList.toggle("hidden", isPassword);
        });

        document.querySelector("#loginForm").addEventListener("submit", (event) => {
            event.preventDefault();
            alert("ກຳລັງເຂົ້າສູ່ລະບົບ...");
        });
    </script>
</body>

</html>
